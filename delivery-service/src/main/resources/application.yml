spring:
  application:
    name: delivery-service
  datasource:
    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5433}/delivery_db
    username: app
    password: app
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.apache.kafka.common.serialization.StringSerializer
      acks: all
      properties:
        enable.idempotence: true
        max.block.ms: 5000
        request.timeout.ms: 10000
        delivery.timeout.ms: 30000
    consumer:
      group-id: delivery-service
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      auto-offset-reset: earliest
      enable-auto-commit: false
    template:
      observation-enabled: true
    listener:
      ack-mode: record
      concurrency: ${app.kafka.listener.concurrency:3}
      observation-enabled: true

server:
  port: 8083

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus
  metrics:
    tags:
      application: ${spring.application.name}
    distribution:
      percentiles-histogram:
        http.server.requests: true
  tracing:
    sampling:
      probability: 1.0
  otlp:
    tracing:
      # Collector (Jaeger) OTLP/HTTP endpoint. Compose sets OTLP_ENDPOINT=http://jaeger:4318/v1/traces.
      # With no collector running, spans are dropped and export errors are only logged.
      endpoint: ${OTLP_ENDPOINT:http://localhost:4318/v1/traces}

delivery:
  eta-minutes: 20

simulation:
  auto-advance: false
  pickup-delay: PT5S
  delivery-delay: PT10S
  tick: PT1S

eureka:
  client:
    enabled: ${EUREKA_ENABLED:false}
    register-with-eureka: ${EUREKA_ENABLED:false}
    fetch-registry: ${EUREKA_ENABLED:false}
    registry-fetch-interval-seconds: 5
    service-url:
      defaultZone: ${EUREKA_URL:http://localhost:8761/eureka/}
  instance:
    prefer-ip-address: true
    instance-id: ${spring.application.name}:${random.value}
    lease-renewal-interval-in-seconds: 5
    lease-expiration-duration-in-seconds: 15
    metadata-map:
      prometheus.path: /actuator/prometheus

logging:
  pattern:
    # traceId == correlationId (hex) for saga requests; correlationId is also kept in the MDC
    correlation: "[%X{traceId:-},%X{spanId:-},%X{correlationId:-}] "

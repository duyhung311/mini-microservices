# Prod-like infra: 3 KRaft brokers (combined mode), RF 3, min.insync.replicas=2 on the 3 main topics.
# Host ports 9092 / 9094 / 9096.
# MUST NOT run at the same time as docker-compose.yml (default stack also publishes 9092).
# Run: docker compose -f docker-compose.prodlike.yml up -d && bash scripts/check-topics.sh --prodlike
# Tear down: docker compose -f docker-compose.prodlike.yml down -v
name: mini-microservices-prodlike

x-kafka: &kafka
  image: apache/kafka:3.9.1
  healthcheck:
    test: ["CMD-SHELL", "/opt/kafka/bin/kafka-broker-api-versions.sh --bootstrap-server localhost:9092 > /dev/null 2>&1"]
    interval: 5s
    timeout: 10s
    retries: 30
    start_period: 15s

x-kafka-env: &kafka-env
  CLUSTER_ID: 5L6g3nShT-eMCtK--X86sw
  KAFKA_PROCESS_ROLES: broker,controller
  KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka-1:9093,2@kafka-2:9093,3@kafka-3:9093
  KAFKA_LISTENERS: PLAINTEXT://:29092,CONTROLLER://:9093,PLAINTEXT_HOST://:9092
  KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT,PLAINTEXT_HOST:PLAINTEXT
  KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
  KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
  KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 3
  KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 3
  KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 2
  KAFKA_DEFAULT_REPLICATION_FACTOR: 3
  KAFKA_MIN_INSYNC_REPLICAS: 2
  KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
  KAFKA_AUTO_CREATE_TOPICS_ENABLE: "false"
  KAFKA_LOG_DIRS: /var/lib/kafka/data

services:
  kafka-1:
    <<: *kafka
    container_name: kafka-1
    ports: ["9092:9092"]
    environment:
      <<: *kafka-env
      KAFKA_NODE_ID: 1
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka-1:29092,PLAINTEXT_HOST://localhost:9092
    volumes: ["kafka-1-data:/var/lib/kafka/data"]

  kafka-2:
    <<: *kafka
    container_name: kafka-2
    ports: ["9094:9092"]
    environment:
      <<: *kafka-env
      KAFKA_NODE_ID: 2
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka-2:29092,PLAINTEXT_HOST://localhost:9094
    volumes: ["kafka-2-data:/var/lib/kafka/data"]

  kafka-3:
    <<: *kafka
    container_name: kafka-3
    ports: ["9096:9092"]
    environment:
      <<: *kafka-env
      KAFKA_NODE_ID: 3
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka-3:29092,PLAINTEXT_HOST://localhost:9096
    volumes: ["kafka-3-data:/var/lib/kafka/data"]

  kafka-init:
    image: apache/kafka:3.9.1
    container_name: kafka-init-prodlike
    depends_on:
      kafka-1: {condition: service_healthy}
      kafka-2: {condition: service_healthy}
      kafka-3: {condition: service_healthy}
    restart: "no"
    entrypoint: ["/bin/sh", "-c"]
    command:
      - |
        set -e
        for t in order.events restaurant.events delivery.events; do
          /opt/kafka/bin/kafka-topics.sh --bootstrap-server kafka-1:29092 --create --if-not-exists \
            --topic "$$t" --partitions 3 --replication-factor 3 --config min.insync.replicas=2
        done
        echo "kafka-init: done"

volumes:
  kafka-1-data:
  kafka-2-data:
  kafka-3-data:

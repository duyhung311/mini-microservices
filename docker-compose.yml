# Default stack: infra only (Kafka KRaft, topic creation, Kafka UI, Postgres).
# Profile `apps` (discovery, gateway, 3 services) and profile `obs` (Prometheus, Grafana, Jaeger, kafka-exporter) are below.
# Do not run together with docker-compose.prodlike.yml (both use host port 9092).
services:
  kafka:
    image: apache/kafka:3.9.1
    container_name: kafka
    ports:
      - "9092:9092"
    environment:
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_NODE_ID: 1
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_LISTENERS: PLAINTEXT://:29092,CONTROLLER://:9093,PLAINTEXT_HOST://:9092
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:29092,PLAINTEXT_HOST://localhost:9092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT,PLAINTEXT_HOST:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_DEFAULT_REPLICATION_FACTOR: 1
      KAFKA_MIN_INSYNC_REPLICAS: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "false"
      KAFKA_LOG_DIRS: /var/lib/kafka/data
    volumes:
      - kafka-data:/var/lib/kafka/data
    healthcheck:
      test: ["CMD-SHELL", "/opt/kafka/bin/kafka-broker-api-versions.sh --bootstrap-server localhost:9092 > /dev/null 2>&1"]
      interval: 5s
      timeout: 10s
      retries: 30
      start_period: 15s

  kafka-init:
    image: apache/kafka:3.9.1
    container_name: kafka-init
    depends_on:
      kafka:
        condition: service_healthy
    restart: "no"
    volumes:
      - ./infra/kafka/topics.txt:/topics.txt:ro
    entrypoint: ["/bin/sh", "-c"]
    command:
      - |
        set -e
        while read -r name partitions; do
          case "$$name" in ""|"#"*) continue;; esac
          /opt/kafka/bin/kafka-topics.sh --bootstrap-server kafka:29092 --create --if-not-exists \
            --topic "$$name" --partitions "$$partitions" --replication-factor 1
        done < /topics.txt
        echo "kafka-init: done"

  kafka-ui:
    image: provectuslabs/kafka-ui:v0.7.2
    container_name: kafka-ui
    depends_on:
      kafka:
        condition: service_healthy
    ports:
      - "8080:8080"
    environment:
      KAFKA_CLUSTERS_0_NAME: local
      KAFKA_CLUSTERS_0_BOOTSTRAPSERVERS: kafka:29092

  postgres:
    image: postgres:16.10-alpine
    container_name: postgres
    ports:
      # Host port 5433: a native Windows PostgreSQL service owns 5432 on this machine.
      - "${POSTGRES_HOST_PORT:-5433}:5432"
    environment:
      POSTGRES_USER: app
      POSTGRES_PASSWORD: app
      POSTGRES_DB: postgres
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ./infra/postgres/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U app -d postgres"]
      interval: 5s
      timeout: 5s
      retries: 20

  # ---- profile `apps`: build jars first with ./mvnw -B -q package -DskipTests ----
  discovery-server:
    profiles: ["apps"]
    build:
      context: .
      dockerfile: docker/service.Dockerfile
      args:
        MODULE: discovery-server
    image: food-delivery/discovery-server:local
    ports:
      - "8761:8761"
    environment:
      OTLP_ENDPOINT: http://jaeger:4318/v1/traces
    mem_limit: 512m
    healthcheck:
      test: ["CMD-SHELL", "curl -fs http://localhost:8761/actuator/health | grep -q UP"]
      interval: 5s
      timeout: 5s
      retries: 30
      start_period: 15s

  api-gateway:
    profiles: ["apps"]
    build:
      context: .
      dockerfile: docker/service.Dockerfile
      args:
        MODULE: api-gateway
    image: food-delivery/api-gateway:local
    ports:
      - "8000:8000"
    environment:
      EUREKA_ENABLED: "true"
      EUREKA_URL: http://discovery-server:8761/eureka/
      OTLP_ENDPOINT: http://jaeger:4318/v1/traces
    mem_limit: 512m
    depends_on:
      discovery-server:
        condition: service_healthy

  order-service:
    profiles: ["apps"]
    build:
      context: .
      dockerfile: docker/service.Dockerfile
      args:
        MODULE: order-service
    image: food-delivery/order-service:local
    environment:
      KAFKA_BOOTSTRAP_SERVERS: kafka:29092
      DB_HOST: postgres
      DB_PORT: "5432"
      EUREKA_ENABLED: "true"
      EUREKA_URL: http://discovery-server:8761/eureka/
      OTLP_ENDPOINT: http://jaeger:4318/v1/traces
    mem_limit: 512m
    depends_on:
      kafka-init:
        condition: service_completed_successfully
      postgres:
        condition: service_healthy
      discovery-server:
        condition: service_healthy

  # Scale with: docker compose --profile apps up -d --scale restaurant-service=3
  # (no container_name, no host ports). HOSTNAME = container id, so X-Instance-Id differs per replica.
  restaurant-service:
    profiles: ["apps"]
    build:
      context: .
      dockerfile: docker/service.Dockerfile
      args:
        MODULE: restaurant-service
    image: food-delivery/restaurant-service:local
    environment:
      KAFKA_BOOTSTRAP_SERVERS: kafka:29092
      DB_HOST: postgres
      DB_PORT: "5432"
      EUREKA_ENABLED: "true"
      EUREKA_URL: http://discovery-server:8761/eureka/
      OTLP_ENDPOINT: http://jaeger:4318/v1/traces
      # 2 listener containers (order.events, delivery.events) per instance, 1 consumer thread each:
      # with 3 replicas every instance owns exactly one order.events partition.
      APP_KAFKA_LISTENER_CONCURRENCY: "1"
    mem_limit: 512m
    depends_on:
      kafka-init:
        condition: service_completed_successfully
      postgres:
        condition: service_healthy
      discovery-server:
        condition: service_healthy

  delivery-service:
    profiles: ["apps"]
    build:
      context: .
      dockerfile: docker/service.Dockerfile
      args:
        MODULE: delivery-service
    image: food-delivery/delivery-service:local
    environment:
      KAFKA_BOOTSTRAP_SERVERS: kafka:29092
      DB_HOST: postgres
      DB_PORT: "5432"
      EUREKA_ENABLED: "true"
      EUREKA_URL: http://discovery-server:8761/eureka/
      OTLP_ENDPOINT: http://jaeger:4318/v1/traces
    mem_limit: 512m
    depends_on:
      kafka-init:
        condition: service_completed_successfully
      postgres:
        condition: service_healthy
      discovery-server:
        condition: service_healthy

  # ---- profile `obs`: metrics, dashboards and traces (local dev credentials) ----
  kafka-exporter:
    profiles: ["obs"]
    image: danielqsj/kafka-exporter:v1.9.0
    command: ["--kafka.server=kafka:29092"]
    ports:
      - "9308:9308"
    mem_limit: 128m
    depends_on:
      kafka:
        condition: service_healthy

  prometheus:
    profiles: ["obs"]
    image: prom/prometheus:v3.5.0
    ports:
      - "9090:9090"
    volumes:
      - ./infra/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
    mem_limit: 384m

  jaeger:
    profiles: ["obs"]
    image: jaegertracing/jaeger:2.11.0
    ports:
      - "16686:16686"
      - "4317:4317"
      - "4318:4318"
    mem_limit: 512m

  grafana:
    profiles: ["obs"]
    image: grafana/grafana:12.1.1
    ports:
      - "3000:3000"
    environment:
      GF_SECURITY_ADMIN_USER: admin
      GF_SECURITY_ADMIN_PASSWORD: admin
      GF_AUTH_ANONYMOUS_ENABLED: "true"
      GF_AUTH_ANONYMOUS_ORG_ROLE: Viewer
    volumes:
      - ./infra/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./infra/grafana/dashboards:/var/lib/grafana/dashboards:ro
    mem_limit: 384m
    depends_on:
      - prometheus
      - jaeger

volumes:
  kafka-data:
  postgres-data:

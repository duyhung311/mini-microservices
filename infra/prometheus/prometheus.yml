# Scrape config for the Compose `obs` profile.
# App instances are found through Eureka (eureka_sd), so scaled restaurant replicas appear on their own.
global:
  scrape_interval: 5s
  evaluation_interval: 5s

scrape_configs:
  - job_name: apps
    metrics_path: /actuator/prometheus
    eureka_sd_configs:
      - server: http://discovery-server:8761/eureka
        refresh_interval: 5s
    relabel_configs:
      # Eureka instance metadata prometheus.path (dots become underscores) -> scrape path
      - source_labels: [__meta_eureka_app_instance_metadata_prometheus_path]
        action: replace
        target_label: __metrics_path__
        regex: (.+)
      - source_labels: [__meta_eureka_app_name]
        target_label: eureka_app
      - source_labels: [__meta_eureka_app_instance_id]
        target_label: instance

  - job_name: discovery-server
    metrics_path: /actuator/prometheus
    static_configs:
      - targets: ["discovery-server:8761"]

  - job_name: kafka-exporter
    static_configs:
      - targets: ["kafka-exporter:9308"]

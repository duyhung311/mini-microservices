# T13: shrunk non-blocking retry delays for every IT in this module (200 ms, x2, max 1000 ms).
# One shared Spring context (one consumer-group member) is used by all ITs, so the retry hops of any test run
# with these delays. OrderRetryBackoffTest asserts the production defaults (1000/5000/25000) from the annotations.
app.kafka.retry.delay-ms=200
app.kafka.retry.multiplier=2
app.kafka.retry.max-delay-ms=1000
